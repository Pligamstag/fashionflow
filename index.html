<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FashionFlow - Bientôt Disponible</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f3a2e 0%, #1a5745 50%, #267a5c 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .background-animation {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(46, 204, 113, 0.08);
            animation: float 25s infinite ease-in-out;
        }

        .circle:nth-child(1) {
            width: 400px;
            height: 400px;
            top: -150px;
            left: -150px;
            animation-delay: 0s;
        }

        .circle:nth-child(2) {
            width: 300px;
            height: 300px;
            bottom: -100px;
            right: 15%;
            animation-delay: 7s;
        }

        .circle:nth-child(3) {
            width: 350px;
            height: 350px;
            top: 40%;
            right: -120px;
            animation-delay: 14s;
        }

        .circle:nth-child(4) {
            width: 250px;
            height: 250px;
            top: 20%;
            left: 20%;
            animation-delay: 3s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) translateX(0) scale(1);
            }
            33% {
                transform: translateY(-40px) translateX(30px) scale(1.15);
            }
            66% {
                transform: translateY(30px) translateX(-30px) scale(0.85);
            }
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            color: white;
            padding: 60px 50px;
            max-width: 900px;
            background: rgba(20, 20, 30, 0.4);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            animation: slideIn 1.2s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(60px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-size: 80px;
            font-weight: 900;
            margin-bottom: 25px;
            background: linear-gradient(135deg, #ffffff 0%, #f0f0f0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -3px;
            text-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .announcement {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 35px;
            color: #ffffff;
            text-shadow: 0 3px 15px rgba(0, 0, 0, 0.4);
            animation: pulse 2.5s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.85;
                transform: scale(1.03);
            }
        }

        .year {
            font-size: 110px;
            font-weight: 900;
            margin: 35px 0;
            color: #ffffff;
            text-shadow: 0 6px 25px rgba(0, 0, 0, 0.5);
            letter-spacing: 10px;
        }

        .tagline {
            font-size: 22px;
            margin-bottom: 45px;
            opacity: 0.95;
            line-height: 1.7;
            color: #e8e8e8;
        }

        .cta-button {
            display: inline-block;
            padding: 20px 55px;
            background: linear-gradient(135deg, #ffffff 0%, #f5f5f5 100%);
            color: #1a5745;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 19px;
            box-shadow: 0 12px 35px rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.8);
        }

        .cta-button:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 50px rgba(255, 255, 255, 0.4);
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 35px;
            margin-top: 55px;
            flex-wrap: wrap;
        }

        .feature {
            background: rgba(255, 255, 255, 0.1);
            padding: 25px 35px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .feature:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-5px);
        }

        .feature-icon {
            font-size: 38px;
            margin-bottom: 12px;
        }

        .feature-text {
            font-size: 17px;
            font-weight: 600;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="background-animation">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>

    <div class="container">
        <div class="logo">FashionFlow</div>
        <div class="announcement">arrive très rapidement !</div>
        <div class="year">2026</div>
        <div class="tagline">
            Révolutionnez votre style avec l'intelligence artificielle.<br>
            La nouvelle ère de la mode personnalisée commence bientôt.
        </div>
        <a href="#" class="cta-button">Être notifié du lancement</a>
        
        <div class="features">
            <div class="feature">
                <div class="feature-icon">✨</div>
                <div class="feature-text">IA Avancée</div>
            </div>
            <div class="feature">
                <div class="feature-icon">👗</div>
                <div class="feature-text">Style Personnalisé</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🚀</div>
                <div class="feature-text">Innovation</div>
            </div>
        </div>
    </div>
</body>
</html>
