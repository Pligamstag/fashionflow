<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FashionFlow - Bientôt Disponible</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f3a2e 0%, #1a5745 50%, #267a5c 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .background-animation {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            overflow: hidden;
            z-index: 0;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(46, 204, 113, 0.08);
            animation: float 25s infinite ease-in-out;
        }

        .circle:nth-child(1) {
            width: 300px;
            height: 300px;
            top: -100px;
            left: -100px;
        }

        .circle:nth-child(2) {
            width: 250px;
            height: 250px;
            bottom: -80px;
            right: 10%;
            animation-delay: 7s;
        }

        .circle:nth-child(3) {
            width: 280px;
            height: 280px;
            top: 30%;
            right: -100px;
            animation-delay: 14s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) translateX(0) scale(1);
            }
            33% {
                transform: translateY(-30px) translateX(20px) scale(1.1);
            }
            66% {
                transform: translateY(20px) translateX(-20px) scale(0.9);
            }
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            color: white;
            padding: 40px 30px;
            max-width: 800px;
            width: 100%;
            background: rgba(20, 20, 30, 0.4);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            animation: slideIn 1.2s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(60px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-size: 56px;
            font-weight: 900;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #ffffff 0%, #f0f0f0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -2px;
        }

        .announcement {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 25px;
            color: #ffffff;
            animation: pulse 2.5s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.85;
                transform: scale(1.03);
            }
        }

        .year {
            font-size: 72px;
            font-weight: 900;
            margin: 25px 0;
            color: #ffffff;
            text-shadow: 0 6px 25px rgba(0, 0, 0, 0.5);
            letter-spacing: 8px;
        }

        .tagline {
            font-size: 18px;
            margin-bottom: 35px;
            opacity: 0.95;
            line-height: 1.6;
            color: #e8e8e8;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            margin-bottom: 40px;
        }

        .cta-button {
            display: inline-block;
            padding: 18px 45px;
            background: linear-gradient(135deg, #ffffff 0%, #f5f5f5 100%);
            color: #1a5745;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 17px;
            box-shadow: 0 12px 35px rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.8);
            width: 100%;
            max-width: 320px;
        }

        .cta-button:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 50px rgba(255, 255, 255, 0.4);
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
        }

        .simulation-button {
            position: relative;
            display: inline-block;
            padding: 18px 45px;
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 17px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.3);
            width: 100%;
            max-width: 320px;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .coming-soon-badge {
            position: absolute;
            top: -12px;
            right: -12px;
            background: #e74c3c;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.5);
            animation: wiggle 2s infinite;
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .feature {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px 25px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            flex: 1;
            min-width: 140px;
            max-width: 200px;
        }

        .feature:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-5px);
        }

        .feature-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .feature-text {
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
        }

        @media (max-width: 768px) {
            .logo {
                font-size: 42px;
            }

            .announcement {
                font-size: 22px;
            }

            .year {
                font-size: 56px;
                letter-spacing: 4px;
            }

            .tagline {
                font-size: 16px;
            }

            .cta-button, .simulation-button {
                font-size: 16px;
                padding: 16px 35px;
            }

            .features {
                gap: 15px;
            }

            .feature {
                min-width: 120px;
                padding: 18px 20px;
            }

            .feature-icon {
                font-size: 28px;
            }

            .feature-text {
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            .logo {
                font-size: 36px;
            }

            .announcement {
                font-size: 20px;
            }

            .year {
                font-size: 48px;
            }

            .tagline {
                font-size: 15px;
            }

            .features {
                flex-direction: column;
            }

            .feature {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="background-animation">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>

    <div class="container">
        <div class="logo">FashionFlow</div>
        <div class="announcement">arrive très rapidement !</div>
        <div class="year">2026</div>
        <div class="tagline">
            Révolutionnez votre style avec l'intelligence artificielle.<br>
            La nouvelle ère de la mode personnalisée commence bientôt.
        </div>
        
        <div class="buttons-container">
            <a href="#" class="simulation-button">
                Tester une simulation
                <span class="coming-soon-badge">Coming Soon</span>
            </a>
        </div>
    </div>
</body>
</html>
